<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sudachi</title>
<meta name="description" content="Sudachi: your media logger. Books, comics and manga, games, anime, films and series — a shelf for what you're on, picks planned around your shifts, your own S–F tiers, and a month and year in review.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Permanent+Marker&amp;family=Pixelify+Sans:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<script>/* interface before first paint (per device) */try{var u=JSON.parse(localStorage.getItem("sudachi.ui")||"{}")||{},st=JSON.parse(localStorage.getItem("sudachi.state.v1")||"{}")||{},ui=u.ui||"sudachi",r=document.documentElement;r.dataset.ui=ui;r.dataset.size=u.size||"normal";var lk=((st.settings||{}).custom||{}).look||{};r.dataset.accent=lk.accent||"sudachi";r.dataset.stickers=lk.stickers===false?"off":"on";r.dataset.motion=lk.motion===false?"off":"on";r.dataset.theme=ui==="paper"||ui==="zine"?"light":"dark";var m=document.querySelector("meta[name=theme-color]");if(m)m.content={sudachi:"#0b0a14",zine:"#f6f1e3",paper:"#F3F4F9",arcade:"#12141F",clean:"#0f1117"}[ui]||"#0b0a14";}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>Sudachi</div>
  <span class="page-title" id="pageTitle" aria-hidden="true"></span>
  <span class="sync" id="syncDot" title="Google sync"></span>
  <span class="small muted" id="syncText"></span>
  <button class="btn icon ghost right" id="btnSearch" title="Search (/)" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="btn icon log" id="btnLog" title="Log something (l)" aria-label="Log something"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="btn icon ghost" id="btnRefresh" title="Refresh (r)" aria-label="Refresh">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="btn icon ghost" id="btnMore" title="Settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</header>
<main id="main">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-library"></section>
  <section class="view" id="view-backlog"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-more"></section>
</main>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="today"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Today</button>
  <button data-view="library"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="m16 5 3.5-.8 2.4 15.3-3.6.7z"/></svg>Library</button>
  <button data-view="backlog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h7"/><path d="M18 14v6M15 17h6"/></svg>Backlog</button>
  <button data-view="review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Review</button>
  <button data-view="more" class="rail-only" title="Settings (,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Settings</button>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
